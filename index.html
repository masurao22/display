
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: sans-serif;
}

.box {
  width: 50%;
  padding: 20px;
}

.ok { color: green; }
.ng { color: red; font-weight: bold; }
</style>
</head>

<body>

<div class="box" id="train">
  <h2>運行情報</h2>
  <p>読み込み中...</p>
</div>

<div class="box" id="weather">
  <h2>天気</h2>
  <p>読み込み中...</p>
</div>

<div id="clock" style="position:fixed; top:10px; right:20px; font-size:24px;"></div>

<script>
// ===== 天気 =====
function updateWeather() {
  fetch("https://api.openweathermap.org/data/2.5/weather?q=Osaka&appid=b754c9ff2255358afc09bbd01a3ac2de&units=metric&lang=ja")
  .then(res => {
    if (!res.ok) throw new Error("APIエラー");
    return res.json();
  })
  .then(data => {
    document.getElementById("weather").innerHTML =
      "<h2>天気（大阪）</h2>" +
      "気温：" + data.main.temp + "℃<br>" +
      "天気：" + data.weather[0].description;
  })
  .catch(() => {
    document.getElementById("weather").innerHTML =
      "<h2>天気</h2><span style='color:red'>取得失敗（APIキー確認）</span>";
  });
}

// ===== 運行情報 =====
function checkLine(id, url) {
  let api = "https://corsproxy.io/?" + encodeURIComponent(url);

  fetch(api)
    .then(res => res.text())
    .then(html => {
      let status = "遅延情報あり";
      let cls = "ng";

      // 正常判定（両方含むときのみ）
      if (
        html.includes("平常運転") &&
        html.includes("事故・遅延に関する情報はありません")
      ) {
        status = "平常運転";
        cls = "ok";
      }

      document.getElementById(id).innerHTML =
        `<span class="${cls}">${status}</span>`;
    })
    .catch(() => {
      document.getElementById(id).innerHTML =
        "<span>取得失敗</span>"; // ←黒字
    });
}


function updateTrain() {
  document.getElementById("train").innerHTML = `
    <h2>運行情報</h2>
    <div>JR環状線：<span id="jr">確認中...</span></div>
    <div>阪神本線：<span id="hanshin">確認中...</span></div>
    <br>
    <a href="https://transit.yahoo.co.jp/diainfo/263/0">詳細（JR）</a><br>
    <a href="https://transit.yahoo.co.jp/diainfo/315/0">詳細（阪神）</a>
  `;

  checkLine("jr", "https://transit.yahoo.co.jp/diainfo/263/0");
  checkLine("hanshin", "https://transit.yahoo.co.jp/diainfo/315/0");
}

// ===== 時間 =====
function updateClock() {
  let now = new Date();
  let time = now.toLocaleTimeString('ja-JP');
  document.getElementById("clock").innerHTML = time;
}

setInterval(updateClock, 1000);
updateClock();



// 初回実行
updateWeather();
updateTrain();

// 定期更新
setInterval(updateWeather, 600000); // 天気10分
setInterval(updateTrain, 30000);    // 運行情報1分
</script>

</body>
</html>
