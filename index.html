<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: sans-serif;
}

.box {
  width: 33.3%;
  padding: 20px;
  box-sizing: border-box;
  font-size: 28px;
}

h2 {
  font-size: 20px;
}

.train-main {
  font-size: 28px;   /* 路線表示 */
}

.train-detail {
  font-size: 20px;   /* 詳細リンク小さめ */
  margin-top: 15px;
}

/* 中央寄せ（時計用） */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
  font-weight: bold;
}

.ok { color: green; }
.ng { color: red; font-weight: bold; }
</style>
</head>

<body>

<!-- 時計 -->
<div class="box center" id="clock"></div>

<!-- 天気 -->
<div class="box" id="weather">
  <h2>天気</h2>
  <p>読み込み中...</p>
</div>

<!-- 運行情報 -->
<div class="box" id="train">
  <h2>運行情報</h2>
  <p>読み込み中...</p>
</div>

<script>
// ===== 時計 =====
function updateClock() {
  let now = new Date();
  let time = now.toLocaleTimeString('ja-JP');
  document.getElementById("clock").innerHTML = time;
}
setInterval(updateClock, 1000);
updateClock();

// ===== 天気 =====
function updateWeather() {
  fetch("https://api.openweathermap.org/data/2.5/forecast?q=Osaka&appid=b754c9ff2255358afc09bbd01a3ac2de&units=metric&lang=ja")
  .then(res => res.json())
  .then(data => {
    let am = null;
    let pm = null;
    let night = null;

    data.list.forEach(item => {
      let hour = new Date(item.dt * 1000).getHours();
      if (!am && hour >= 6 && hour < 12) am = item;
      if (!pm && hour >= 12 && hour < 18) pm = item;
      if (!night && hour >= 18 && hour < 24) night = item;
    });

    document.getElementById("weather").innerHTML =
      "<h2>天気（大阪）</h2>" +
      (am ? "AM：" + am.weather[0].description + " / " + am.main.temp + "℃<br>" : "") +
      (pm ? "PM：" + pm.weather[0].description + " / " + pm.main.temp + "℃<br>" : "") +
      (night ? "夜：" + night.weather[0].description + " / " + night.main.temp + "℃" : "");
  })
  .catch(() => {
    document.getElementById("weather").innerHTML =
      "<h2>天気</h2><span style='color:red'>取得失敗</span>";
  });
}

// ===== 運行情報 ===== 

// 1. JR西日本の運行情報取得
function checkJR(lineCode, elementId) {
  // JR西日本が公式に一般公開している運行情報JSON（近畿エリア）
  fetch("https://westjr.co.jp")
    .then(res => res.json())
    .then(data => {
      // 該当路線のデータを検索
      let lineData = data.lines[lineCode];
      
      if (!lineData) {
        document.getElementById(elementId).innerHTML = `<span class="ok">平常運転</span>`;
        return;
      }

      // 直近の運行状態（平常に復旧したばかり、または問題発生中か）
      if (lineData.normal) {
        document.getElementById(elementId).innerHTML = `<span class="ok">平常運転</span>`;
      } else {
        document.getElementById(elementId).innerHTML = `<span class="ng">遅延情報あり</span>`;
      }
    })
    .catch(() => {
      document.getElementById(elementId).innerHTML = "<span>取得失敗</span>";
    });
}

// 2. 阪神電気鉄道の運行情報取得
function checkHanshin(elementId) {
  // 阪神電鉄が公式に一般公開している運行情報JSON
  fetch("https://hanshin.co.jp")
    .then(res => res.json())
    .then(data => {
      // 阪神のJSONは平常時、"status": 0 または "pc_text": "現在、１５分以上の遅れはありません。" となる仕様
      if (data.status === 0) {
        document.getElementById(elementId).innerHTML = `<span class="ok">平常運転</span>`;
      } else {
        document.getElementById(elementId).innerHTML = `<span class="ng">遅延情報あり</span>`;
      }
    })
    .catch(() => {
      document.getElementById(elementId).innerHTML = "<span>取得失敗</span>";
    });
}

function updateTrain() {
  document.getElementById("train").innerHTML = `
    <h2>運行情報</h2>
    <div class="train-main">
      <div>JR環状線：<span id="kanjo">確認中...</span></div>
      <div>JR京都線：<span id="kyoto">確認中...</span></div>
      <div>阪神本線：<span id="hanshin">確認中...</span></div>
    </div>
    <div class="train-detail">
      <br>
      <a href="https://westjr.co.jp" target="_blank">詳細（JR西日本公式）</a><br>
      <a href="https://hanshin.co.jp" target="_blank">詳細（阪神電鉄公式）</a>
    </div>
  `;

  // JR西日本の路線コード（osakaloop: 大阪環状線, kyoto: JR京都線）
  checkJR("osakaloop", "kanjo");
  checkJR("kyoto", "kyoto");
  
  // 阪神本線のチェック
  checkHanshin("hanshin");
}

// 初回実行
updateWeather();
updateTrain();

// 定期更新
setInterval(updateWeather, 600000); // 10分
setInterval(updateTrain, 60000);    // 1分
</script>

</body>
</html>
