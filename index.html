<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: sans-serif;
}

.box {
  width: 33.3%;
  padding: 20px;
  box-sizing: border-box;
  font-size: 28px;
}

h2 {
  font-size: 20px;
}

.train-main {
  font-size: 28px;   /* 路線表示 */
}

.train-detail {
  font-size: 20px;   /* 詳細リンク小さめ */
  margin-top: 15px;
}

/* 中央寄せ（時計用） */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
  font-weight: bold;
}

.ok { color: green; }
.ng { color: red; font-weight: bold; }
</style>
</head>

<body>

<!-- 時計 -->
<div class="box center" id="clock"></div>

<!-- 天気 -->
<div class="box" id="weather">
  <h2>天気</h2>
  <p>読み込み中...</p>
</div>

<!-- 運行情報 -->
<div class="box" id="train">
  <h2>運行情報</h2>
  <p>読み込み中...</p>
</div>

<script>
// ===== 時計 =====
function updateClock() {
  let now = new Date();
  let time = now.toLocaleTimeString('ja-JP');
  document.getElementById("clock").innerHTML = time;
}
setInterval(updateClock, 1000);
updateClock();

// ===== 天気 =====
function updateWeather() {
  fetch("https://openweathermap.org")
  .then(res => res.json())
  .then(data => {
    let am = null;
    let pm = null;
    let night = null;

    data.list.forEach(item => {
      let hour = new Date(item.dt * 1000).getHours();
      if (!am && hour >= 6 && hour < 12) am = item;
      if (!pm && hour >= 12 && hour < 18) pm = item;
      if (!night && hour >= 18 && hour < 24) night = item;
    });

    document.getElementById("weather").innerHTML =
      "<h2>天気（大阪）</h2>" +
      (am ? "AM：" + am.weather[0].description + " / " + Math.round(am.main.temp) + "℃<br>" : "") +
      (pm ? "PM：" + pm.weather[0].description + " / " + Math.round(pm.main.temp) + "℃<br>" : "") +
      (night ? "夜：" + night.weather[0].description + " / " + Math.round(night.main.temp) + "℃" : "");
  })
  .catch(() => {
    document.getElementById("weather").innerHTML =
      "<h2>天気</h2><span style='color:red'>取得失敗</span>";
  });
}

// ===== 運行情報（CORSフリーの鉄道情報パブリックデータを使用） ===== 

function updateTrain() {
  document.getElementById("train").innerHTML = `
    <h2>運行情報</h2>
    <div class="train-main">
      <div>JR環状線：<span id="kanjo">確認中...</span></div>
      <div>JR京都線：<span id="kyoto">確認中...</span></div>
      <div>阪神本線：<span id="hanshin">確認中...</span></div>
    </div>
    <div class="train-detail">
      <br>
      <a href="https://westjr.co.jp" target="_blank">詳細（JR西日本公式）</a><br>
      <a href="https://hanshin.co.jp" target="_blank">詳細（阪神電鉄公式）</a>
    </div>
  `;

  // JR西日本 運行情報（公式X配信データミラー / CORSフリー）
  fetch("https://p0x0q.com")
    .then(res => res.json())
    .then(data => {
      // 大阪環状線の判定
      let kanjoStatus = data.find(line => line.name && line.name.includes("大阪環状線"));
      if (kanjoStatus && kanjoStatus.status && !kanjoStatus.status.includes("平常")) {
        document.getElementById("kanjo").innerHTML = `<span class="ng">遅延情報あり</span>`;
      } else {
        document.getElementById("kanjo").innerHTML = `<span class="ok">平常運転</span>`;
      }

      // JR京都線の判定
      let kyotoStatus = data.find(line => line.name && line.name.includes("JR京都線"));
      if (kyotoStatus && kyotoStatus.status && !kyotoStatus.status.includes("平常")) {
        document.getElementById("kyoto").innerHTML = `<span class="ng">遅延情報あり</span>`;
      } else {
        document.getElementById("kyoto").innerHTML = `<span class="ok">平常運転</span>`;
      }
    })
    .catch(() => {
      document.getElementById("kanjo").innerHTML = "<span>取得失敗</span>";
      document.getElementById("kyoto").innerHTML = "<span>取得失敗</span>";
    });

  // 阪神電気鉄道 運行情報（公式X配信データミラー / CORSフリー）
  fetch("https://p0x0q.com")
    .then(res => res.json())
    .then(data => {
      // 阪神本線（または全体）の判定
      let hanshinStatus = data.find(line => line.name && line.name.includes("阪神本線")) || data[0];
      if (hanshinStatus && hanshinStatus.status && !hanshinStatus.status.includes("平常")) {
        document.getElementById("hanshin").innerHTML = `<span class="ng">遅延情報あり</span>`;
      } else {
        document.getElementById("hanshin").innerHTML = `<span class="ok">平常運転</span>`;
      }
    })
    .catch(() => {
      document.getElementById("hanshin").innerHTML = "<span>取得失敗</span>";
    });
}

// 初回実行
updateWeather();
updateTrain();

// 定期更新
setInterval(updateWeather, 600000); // 10分
setInterval(updateTrain, 60000);    // 1分
</script>

</body>
</html>
