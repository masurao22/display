<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: sans-serif;
}

.box {
  width: 50%;
  padding: 20px;
}

.ok { color: green; }
.ng { color: red; font-weight: bold; }
</style>
</head>

<body>

<div class="box" id="train">
  <h2>運行情報</h2>
  <p>取得中...</p>
</div>

<div class="box" id="weather">
  <h2>天気</h2>
  <p>取得中...</p>
</div>

<script>
// ===== 天気 =====
fetch("https://api.openweathermap.org/data/2.5/weather?q=Osaka&appid=YOUR_API_KEY&units=metric&lang=ja")
.then(res => res.json())
.then(data => {
  document.getElementById("weather").innerHTML =
    "<h2>天気（大阪）</h2>" +
    "気温：" + data.main.temp + "℃<br>" +
    "天気：" + data.weather[0].description;
});

// ===== 運行情報 =====
function checkLine(name, url) {
  let api = "https://api.allorigins.win/get?url=" + encodeURIComponent(url);

  fetch(api)
    .then(res => res.json())
    .then(data => {
      let html = data.contents;

      let status = "平常運転";
      let cls = "ok";

      if (html.includes("遅延") || html.includes("運転見合わせ")) {
        status = "遅延あり";
        cls = "ng";
      }

      document.getElementById(name).innerHTML =
        `<span class="${cls}">${status}</span>`;
    })
    .catch(() => {
      document.getElementById(name).innerHTML = "取得失敗";
    });
}

function updateTrain() {
  document.getElementById("train").innerHTML = `
    <h2>運行情報</h2>
    <div>JR環状線：<span id="jr">確認中...</span></div>
    <div>阪神本線：<span id="hanshin">確認中...</span></div>
    <br>
    <a href="https://transit.yahoo.co.jp/diainfo/66/0">詳細（JR）</a><br>
    <a href="https://transit.yahoo.co.jp/diainfo/96/0">詳細（阪神）</a>
  `;

  checkLine("jr", "https://transit.yahoo.co.jp/diainfo/66/0");
  checkLine("hanshin", "https://transit.yahoo.co.jp/diainfo/96/0");
}

// 初回
updateTrain();

// 1分ごと更新
setInterval(updateTrain, 60000);

</script>

</body>
</html>
