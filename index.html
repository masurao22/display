<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: sans-serif;
}

.box {
  width: 33.3%;
  padding: 20px;
  box-sizing: border-box;
  font-size: 28px;
}

h2 {
  font-size: 20px;
}


.train-main {
  font-size: 28px;   /* 路線表示 */
}

.train-detail {
  font-size: 20px;   /* 詳細リンク小さめ */
  margin-top: 15px;
}

/* 中央寄せ（時計用） */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
  font-weight: bold;
}

.ok { color: green; }
.ng { color: red; font-weight: bold; }
</style>
</head>

<body>

<!-- 時計 -->
<div class="box center" id="clock"></div>

<!-- 天気 -->
<div class="box" id="weather">
  <h2>天気</h2>
  <p>読み込み中...</p>
</div>

<!-- 運行情報 -->
<div class="box" id="train">
  <h2>運行情報</h2>
  <p>読み込み中...</p>
</div>

<script>
// ===== 時計 =====
function updateClock() {
  let now = new Date();
  let time = now.toLocaleTimeString('ja-JP');
  document.getElementById("clock").innerHTML = time;
}
setInterval(updateClock, 1000);
updateClock();

// ===== 天気 =====
function updateWeather() {
  fetch("https://api.openweathermap.org/data/2.5/forecast?q=Osaka&appid=b754c9ff2255358afc09bbd01a3ac2de&units=metric&lang=ja")
  .then(res => res.json())
  .then(data => {

    let am = null;
    let pm = null;
    let night = null;

    data.list.forEach(item => {
      let hour = new Date(item.dt * 1000).getHours();

      if (!am && hour >= 6 && hour < 12) am = item;
      if (!pm && hour >= 12 && hour < 18) pm = item;
      if (!night && hour >= 18 && hour < 24) night = item;
    });

    document.getElementById("weather").innerHTML =
      "<h2>天気（大阪）</h2>" +
      (am ? "AM：" + am.weather[0].description + " / " + am.main.temp + "℃<br>" : "") +
      (pm ? "PM：" + pm.weather[0].description + " / " + pm.main.temp + "℃<br>" : "") +
      (night ? "夜：" + night.weather[0].description + " / " + night.main.temp + "℃" : "");

  })
  .catch(() => {
    document.getElementById("weather").innerHTML =
      "<h2>天気</h2><span style='color:red'>取得失敗</span>";
  });
}


// ===== 運行情報 ===== 
function checkLine(id, url) {
  let api = "https://corsproxy.io/?" + encodeURIComponent(url);

  fetch(api)
    .then(res => res.text())
    .then(html => {
      let status = "遅延情報あり";
      let cls = "ng";

      if (
        html.includes("平常運転") &&
        html.includes("事故・遅延に関する情報はありません")
      ) {
        status = "平常運転";
        cls = "ok";
      }

      document.getElementById(id).innerHTML =
        `<span class="${cls}">${status}</span>`;
    })
    .catch(() => {
      document.getElementById(id).innerHTML =
        "<span>取得失敗</span>";
    });
}

function updateTrain() {
  document.getElementById("train").innerHTML = `
    <h2>運行情報</h2>

    <div class="train-main">
    <div>JR環状線：<span id="kanjo">確認中...</span></div>
    <div>JR京都線：<span id="kyoto">確認中...</span></div>
    <div>阪神本線：<span id="hanshin">確認中...</span></div>

    <div class="train-detail"
    <br>
    <a href="https://transit.yahoo.co.jp/diainfo/263/0">詳細（JR環状線）</a><br>
    <a href="https://transit.yahoo.co.jp/diainfo/267/0">詳細（JR京都線）</a><br>
    <a href="https://transit.yahoo.co.jp/diainfo/315/0">詳細（阪神）</a>
  `;

  checkLine("kanjo", "https://transit.yahoo.co.jp/diainfo/263/0");
  checkLine("kyoto", "https://transit.yahoo.co.jp/diainfo/267/0");
  checkLine("hanshin", "https://transit.yahoo.co.jp/diainfo/315/0");
}

// 初回実行
updateWeather();
updateTrain();

// 定期更新
setInterval(updateWeather, 600000);
setInterval(updateTrain, 60000);
</script>

</body>
</html>
