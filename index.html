<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>

<script>
let urls = [
  "https://trafficinfo.westjr.co.jp/kinki.html",
  "https://weathernews.jp/"
];

let index = 0;

function switchPage() {
  index = (index + 1) % urls.length;
  window.location.href = urls[index];
}

setInterval(switchPage, 15000);
</script>

</head>

<body>
<script>
  window.location.href = urls[0];
</script>
</body>
</html>
